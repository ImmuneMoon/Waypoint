name: Checks

# Runs the offline test suites in tools/*check.js on every push to any branch and on pull requests.
# Nothing to install: the checks use only Node's built-in fs/path and import the app's ES modules
# straight from system/app. cleanupcheck's last case reads saves/data.json READ-ONLY and skips when
# it is absent — saves/ is git-ignored, so it never exists on a runner.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test suites (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a whole run takes under a minute: a suite that hangs (a handle left open) fails here instead of waiting out GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # the app's tools run on whatever Node the machine has; a suite must not depend on one parser's output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # One step per suite so a failure names the suite in the Actions UI. Every step still runs
      # after an earlier failure (!cancelled()); the job fails if any step did.
      - name: parsecheck — every module loads
        run: node tools/parsecheck.js
      - name: tutorialcheck — tour targets exist
        if: ${{ !cancelled() }}
        run: node tools/tutorialcheck.js
      - name: doccheck — handbook renderer, sanitizer, Markdown
        if: ${{ !cancelled() }}
        run: node tools/doccheck.js
      - name: formulacheck — formula engine
        if: ${{ !cancelled() }}
        run: node tools/formulacheck.js
      - name: systemcheck — character system + sheet model
        if: ${{ !cancelled() }}
        run: node tools/systemcheck.js
      - name: dicecheck — dice engine
        if: ${{ !cancelled() }}
        run: node tools/dicecheck.js
      - name: itemcheck — item library
        if: ${{ !cancelled() }}
        run: node tools/itemcheck.js
      - name: catalogcheck — making a catalogue (a spreadsheet read as a pack, a row added to the library, a first pack guided)
        if: ${{ !cancelled() }}
        run: node tools/catalogcheck.js
      - name: librarycheck — the library's pure core (entries, packs, manifest)
        if: ${{ !cancelled() }}
        run: node tools/librarycheck.js
      - name: servercheck — the local server's library storage (run on a scratch folder)
        if: ${{ !cancelled() }}
        run: node tools/servercheck.js
      - name: vttcheck — VTT feature toggles
        if: ${{ !cancelled() }}
        run: node tools/vttcheck.js
      - name: fogcheck — fog of war
        if: ${{ !cancelled() }}
        run: node tools/fogcheck.js
      - name: arrangecheck — arranging a sheet by dragging
        if: ${{ !cancelled() }}
        run: node tools/arrangecheck.js
      - name: soundcheck — sound library
        if: ${{ !cancelled() }}
        run: node tools/soundcheck.js
      - name: fxcheck — visual effects
        if: ${{ !cancelled() }}
        run: node tools/fxcheck.js
      - name: fxsavedcheck — saved effects with sounds
        if: ${{ !cancelled() }}
        run: node tools/fxsavedcheck.js
      - name: startercheck — a starter system with its packs
        if: ${{ !cancelled() }}
        run: node tools/startercheck.js
      - name: viewcheck — the view that turns with your token
        if: ${{ !cancelled() }}
        run: node tools/viewcheck.js
      - name: musiccheck — music playlists
        if: ${{ !cancelled() }}
        run: node tools/musiccheck.js
      - name: cleanupcheck — save cleanup classifier
        if: ${{ !cancelled() }}
        run: node tools/cleanupcheck.js
      - name: netcheck — host-side wire gates (admission, identity, chat)
        if: ${{ !cancelled() }}
        run: node tools/netcheck.js
      - name: sinkcheck — the GM's renderers against a campaign from a file
        if: ${{ !cancelled() }}
        run: node tools/sinkcheck.js
      - name: framecheck — the token creator's pure core
        if: ${{ !cancelled() }}
        run: node tools/framecheck.js
      - name: ceilingcheck — a system at every ceiling, timed
        if: ${{ !cancelled() }}
        run: node tools/ceilingcheck.js
      - name: calendarcheck — the game calendar's pure core
        if: ${{ !cancelled() }}
        run: node tools/calendarcheck.js
      - name: videocheck — campaign videos' pure core and the Video panel's rules
        if: ${{ !cancelled() }}
        run: node tools/videocheck.js
      - name: campsafecheck — restore points, a trial run and a test copy, the pure core and the flows on stand-ins
        if: ${{ !cancelled() }}
        run: node tools/campsafecheck.js
      - name: recordcheck — the game record, its store and its wiring
        if: ${{ !cancelled() }}
        run: node tools/recordcheck.js
      - name: drawshowcheck — drawings to show over the fog, their stay, the ask and the bell
        if: ${{ !cancelled() }}
        run: node tools/drawshowcheck.js
      - name: noticecheck — a band of side vision that notices by a roll
        if: ${{ !cancelled() }}
        run: node tools/noticecheck.js
      - name: profilecheck — a profile carried to another computer, its file, its code and what opening it writes
        if: ${{ !cancelled() }}
        run: node tools/profilecheck.js
      - name: mousecheck — a command on a mouse press, the map's own gestures, and the mouse going with the profile
        if: ${{ !cancelled() }}
        run: node tools/mousecheck.js
      - name: rowlockcheck — a list's cells locked while a test of the character holds, for everyone
        if: ${{ !cancelled() }}
        run: node tools/rowlockcheck.js
      - name: accountcheck — this install linked to a Waypoint website account, the shell's routes and the order of linking
        if: ${{ !cancelled() }}
        run: node tools/accountcheck.js
      - name: cloudcheck — cloud saves, the shell's half, against a site of its own
        if: ${{ !cancelled() }}
        run: node tools/cloudcheck.js
      - name: shapecheck — turn shapes
        if: ${{ !cancelled() }}
        run: node tools/shapecheck.js
      - name: deckcheck — decks and bags
        if: ${{ !cancelled() }}
        run: node tools/deckcheck.js
      - name: valuecheck — numbers the whole table shares
        if: ${{ !cancelled() }}
        run: node tools/valuecheck.js
      - name: resultcheck — result tables
        if: ${{ !cancelled() }}
        run: node tools/resultcheck.js
      - name: moneycheck — currencies, money held and moved in each
        if: ${{ !cancelled() }}
        run: node tools/moneycheck.js
      - name: setupcheck — a map's set-ups of its tokens, fog and lights
        if: ${{ !cancelled() }}
        run: node tools/setupcheck.js
      - name: plookcheck — a personal look, a character's name in a font and colour of its own
        if: ${{ !cancelled() }}
        run: node tools/plookcheck.js
      - name: rowlookcheck — the look of a row's note, an own row's name and description, and an effect's name
        if: ${{ !cancelled() }}
        run: node tools/rowlookcheck.js
      - name: markcheck — a number, a pool or a formula shown as dots, boxes or a clock, and the box fill rule
        if: ${{ !cancelled() }}
        run: node tools/markcheck.js
      - name: fxvalcheck — an effect that holds a number, added again, falling over time, changed by hand
        if: ${{ !cancelled() }}
        run: node tools/fxvalcheck.js
      - name: callrowcheck — a call that runs a list’s roll on a row, or goes to the roller
        if: ${{ !cancelled() }}
        run: node tools/callrowcheck.js
      - name: helpchipcheck — Help draws the controls it names and shows each one where it is
        if: ${{ !cancelled() }}
        run: node tools/helpchipcheck.js
      - name: namecheck — the name button, its lists and the names it makes up
        if: ${{ !cancelled() }}
        run: node tools/namecheck.js
      - name: plancardcheck — a planner's Person, Place and Clue cards and their other names
        if: ${{ !cancelled() }}
        run: node tools/plancardcheck.js
      - name: compasscheck — a map's compass, the way it names and the rose
        if: ${{ !cancelled() }}
        run: node tools/compasscheck.js
      - name: dice3dcheck — animated dice, the stand-in dice, a model file and the face each die lands on
        if: ${{ !cancelled() }}
        run: node tools/dice3dcheck.js
      - name: assistcheck — a roll that waits for others to help, its card and what each helper adds
        if: ${{ !cancelled() }}
        run: node tools/assistcheck.js
      - name: dicebonuscheck — dice added to a roll, in the modifier window and as a roll bonus
        if: ${{ !cancelled() }}
        run: node tools/dicebonuscheck.js
      - name: woundfcheck — a wound worked out by a formula, for every type or one, and a wound of 0
        if: ${{ !cancelled() }}
        run: node tools/woundfcheck.js
      - name: thengmcheck — a Then step players may not see, run on the host
        if: ${{ !cancelled() }}
        run: node tools/thengmcheck.js
      - name: togmcheck — a roll that goes straight to the GM
        if: ${{ !cancelled() }}
        run: node tools/togmcheck.js
      - name: askcheck — what a roll or an action asks as it is pressed
        if: ${{ !cancelled() }}
        run: node tools/askcheck.js
      - name: bodycheck — rows that hang from a row, and what a grant names
        if: ${{ !cancelled() }}
        run: node tools/bodycheck.js
      - name: vehiclecheck — a row joined to a sheet, and the vehicle folds
        if: ${{ !cancelled() }}
        run: node tools/vehiclecheck.js
      - name: cardcheck — what a roll's card offers before it lands
        if: ${{ !cancelled() }}
        run: node tools/cardcheck.js
      - name: objcheck — map objects, the pure core, the GM's window, the wire and the words
        if: ${{ !cancelled() }}
        run: node tools/objcheck.js
      - name: furncheck — furnishings, the drawings, the rules a map object gives, the palette, the drop, the wire and the words
        if: ${{ !cancelled() }}
        run: node tools/furncheck.js
      - name: scenecheck — a picture shown big to the table, the GM box, the player window, the wire and the pill
        if: ${{ !cancelled() }}
        run: node tools/scenecheck.js
      - name: soundoncheck — sounds on actions, the pure core, the host's hooks, the list and the words
        if: ${{ !cancelled() }}
        run: node tools/soundoncheck.js
      - name: trackcheck — the table trackers, the pure core, the strip, the stream window and the pins
        if: ${{ !cancelled() }}
        run: node tools/trackcheck.js
      - name: formcheck — formulas as forms, read and written back the same, in words, and the form on a page that refuses markup
        if: ${{ !cancelled() }}
        run: node tools/formcheck.js
      - name: imgtagcheck — the Image Library tags, the pure core, the chips and menus drawn as text, and the pins
        if: ${{ !cancelled() }}
        run: node tools/imgtagcheck.js
      - name: voicecheck — voice chat's pure core, the host's hub and a player's link on stub connections
        if: ${{ !cancelled() }}
        run: node tools/voicecheck.js
      - name: zipcheck — the export bundle's archive, at any size
        if: ${{ !cancelled() }}
        run: node tools/zipcheck.js
      - name: textcheck — text formats (the look of a plain field, stored beside its text), the editor's boxes and the bar on them
        if: ${{ !cancelled() }}
        run: node tools/textcheck.js
      - name: pagecheck — the page's own navigation (the Outline of a planner or a page, and its menu)
        if: ${{ !cancelled() }}
        run: node tools/pagecheck.js
      - name: floatcheck — floating boxes and the views they show on (put away off the play map, back as left)
        if: ${{ !cancelled() }}
        run: node tools/floatcheck.js
      - name: shelfcheck — pages in a session (where a page opens, the Pages shelf, tabs in the panel, map pins) and the names in this file
        if: ${{ !cancelled() }}
        run: node tools/shelfcheck.js
      - name: lookcheck — the look of the play map (no control removed, the toolbar's line icons, gold for the tool in hand)
        if: ${{ !cancelled() }}
        run: node tools/lookcheck.js
      - name: sysuicheck — the System editor's layout, the topics, the list beside one open, nothing removed
        if: ${{ !cancelled() }}
        run: node tools/sysuicheck.js
      - name: buildcheck — the map builder's pure core (code-drawn textures, materials, the lattice maths)
        if: ${{ !cancelled() }}
        run: node tools/buildcheck.js
      - name: updatercheck — signed updates, the way back, the core updating itself, the key tool and the core's record (run on scratch installs; nothing downloaded is ever started)
        if: ${{ !cancelled() }}
        run: node tools/updatercheck.js
      - name: campquestcheck, a campaign started from questions (the outline it writes, read by the real page code)
        if: ${{ !cancelled() }}
        run: node tools/campquestcheck.js
      - name: uicheck, the app's own controls (a counter and a slider with a value you type in, on every site)
        if: ${{ !cancelled() }}
        run: node tools/uicheck.js
      - name: layoutcheck, the layout editor (where the toolbars and boxes of the map stand, the edit mode, nothing written without a layout)
        if: ${{ !cancelled() }}
        run: node tools/layoutcheck.js
      - name: drawcheck, drawing a pack's pictures in Waypoint (the paint window, a fill that wraps, layers, undo)
        if: ${{ !cancelled() }}
        run: node tools/drawcheck.js
      - name: storycheck, the Story view (arcs and beats from the planners, a beat moved inside its planner)
        if: ${{ !cancelled() }}
        run: node tools/storycheck.js
      - name: timelinecheck, the timeline ribbon (eras, dated notes, sessions played, its zoom)
        if: ${{ !cancelled() }}
        run: node tools/timelinecheck.js
      - name: prepcheck, the Prep column (the cards for the map on screen, Find a card, the column drawn)
        if: ${{ !cancelled() }}
        run: node tools/prepcheck.js
      - name: roomcheck, the Data Map rooms (a room added with its name ready, a link dragged from a room, a room made for a play map piece)
        if: ${{ !cancelled() }}
        run: node tools/roomcheck.js
      - name: ilayerscheck, interaction layers (the kinds a piece belongs to, what this computer keeps, As players see it, the board's marks)
        if: ${{ !cancelled() }}
        run: node tools/ilayerscheck.js
      - name: boxcheck, containers (what a container holds, Holds items, the container window and its wiring)
        if: ${{ !cancelled() }}
        run: node tools/boxcheck.js
