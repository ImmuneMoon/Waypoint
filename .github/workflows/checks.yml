name: Checks

# Runs the offline test suites in tools/*check.js on every push to any branch and on pull requests.
# Nothing to install: the checks use only Node's built-in fs/path and import the app's ES modules
# straight from system/app. cleanupcheck's last case reads saves/data.json READ-ONLY and skips when
# it is absent — saves/ is git-ignored, so it never exists on a runner.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test suites (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a whole run took 8m16s on Node 22 before the test split's steps 1 to 3 added 16 steps, and each new suite loads its own core (splitcheck alone runs fuzzcheck twice, some 40 seconds): a suite that hangs (a handle left open) fails here instead of waiting out GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # the app's tools run on whatever Node the machine has; a suite must not depend on one parser's output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # One step per suite so a failure names the suite in the Actions UI. Every step still runs
      # after an earlier failure (!cancelled()); the job fails if any step did.
      - name: parsecheck — every module loads
        run: node tools/parsecheck.js
      - name: splitcheck — the giant scripts split into parts are wired as the single file they were
        if: ${{ !cancelled() }}
        run: node tools/splitcheck.js
      - name: tutorialcheck — tour targets exist
        if: ${{ !cancelled() }}
        run: node tools/tutorialcheck.js
      - name: doccheck — handbook renderer, sanitizer, Markdown
        if: ${{ !cancelled() }}
        run: node tools/doccheck.js
      - name: formulacheck — formula engine
        if: ${{ !cancelled() }}
        run: node tools/formulacheck.js
      - name: systemcheck — character system + sheet model
        if: ${{ !cancelled() }}
        run: node tools/systemcheck.js
      - name: listcheck — a list and its rows facts, With stats, highest and lowest, the caps and Locked while, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/listcheck.js
      - name: listrulecheck — a copy of its own values, Setting A, the custom op and the stats a player asks for, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/listrulecheck.js
      - name: listrowcheck — a list of rows, backlog 180, parts, grants and Laid from, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/listrowcheck.js
      - name: speccheck — At most at a level, bars, a row look, fitted slots, Specialties and Subjects, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/speccheck.js
      - name: loadcheck — Loads from, Chambers from, Counted once, Feeds, a job, holds, a line and cover hits, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/loadcheck.js
      - name: rollcheck — a roll and its needs and reasons, consequences, counters, Malf and criticals, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/rollcheck.js
      - name: applycheck — what an action applies and when, the library, grants and roll switches, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/applycheck.js
      - name: needcheck — what a player may see and take, GM-only values, budgets and prerequisites, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/needcheck.js
      - name: stancecheck — the token stance, walls, a move in cells, crossings and names by place, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/stancecheck.js
      - name: envcheck — the map environment, a row taken off, other names and tables, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/envcheck.js
      - name: hudcheck — the HUD frame HF0 to HF5 and a redraw keeping the sheet and HUD in place, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/hudcheck.js
      - name: sheetlookcheck — the sheet look L1 to L7, doc theming, the typefaces and a character text looks, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/sheetlookcheck.js
      - name: onboardcheck — onboarding F0 to F4, uploads, a sheet reader hook, the token creator and the sheet revision, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/onboardcheck.js
      - name: sensecheck — the light, senses, range, height and cover rules, conditions C1 and a player light, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/sensecheck.js
      - name: boardcheck — the board, Enter on a checkbox, menus, the drag hand-overs and grid fitting, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/boardcheck.js
      - name: sitecheck — the website forms, renames, auto apply, CORE batch 6, 167 and 218 and rests, out of systemcheck
        if: ${{ !cancelled() }}
        run: node tools/sitecheck.js
      - name: corecheck — the core's cleaners and validator, read from cleancore.js and validcore.js by name, with the core's first tests
        if: ${{ !cancelled() }}
        run: node tools/corecheck.js
      - name: damagecheck — the damage step and a burst, read from damagecore.js by name
        if: ${{ !cancelled() }}
        run: node tools/damagecheck.js
      - name: answercheck — a card to press and what an attack reads of its attacker, read from answercore.js by name
