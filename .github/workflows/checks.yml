name: Checks

# Runs the offline test suites in tools/*check.js on every push to any branch and on pull requests.
# Nothing to install: the checks use only Node's built-in fs/path and import the app's ES modules
# straight from system/app. cleanupcheck's last case reads saves/data.json READ-ONLY and skips when
# it is absent — saves/ is git-ignored, so it never exists on a runner.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test suites (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a whole run takes under a minute: a suite that hangs (a handle left open) fails here instead of waiting out GitHub's six hours
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # the app's tools run on whatever Node the machine has; a suite must not depend on one parser's output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # One step per suite so a failure names the suite in the Actions UI. Every step still runs
      # after an earlier failure (!cancelled()); the job fails if any step did.
      - name: parsecheck — every module loads
        run: node tools/parsecheck.js
      - name: tutorialcheck — tour targets exist
        if: ${{ !cancelled() }}
        run: node tools/tutorialcheck.js
      - name: doccheck — handbook renderer, sanitizer, Markdown
        if: ${{ !cancelled() }}
        run: node tools/doccheck.js
      - name: formulacheck — formula engine
        if: ${{ !cancelled() }}
        run: node tools/formulacheck.js
      - name: systemcheck — character system + sheet model
        if: ${{ !cancelled() }}
        run: node tools/systemcheck.js
      - name: dicecheck — dice engine
        if: ${{ !cancelled() }}
        run: node tools/dicecheck.js
      - name: itemcheck — item library
        if: ${{ !cancelled() }}
        run: node tools/itemcheck.js
      - name: librarycheck — the library's pure core (entries, packs, manifest)
        if: ${{ !cancelled() }}
        run: node tools/librarycheck.js
      - name: servercheck — the local server's library storage (run on a scratch folder)
        if: ${{ !cancelled() }}
        run: node tools/servercheck.js
      - name: vttcheck — VTT feature toggles
        if: ${{ !cancelled() }}
        run: node tools/vttcheck.js
      - name: fogcheck — fog of war
        if: ${{ !cancelled() }}
        run: node tools/fogcheck.js
      - name: soundcheck — sound library
        if: ${{ !cancelled() }}
        run: node tools/soundcheck.js
      - name: fxcheck — visual effects
        if: ${{ !cancelled() }}
        run: node tools/fxcheck.js
      - name: musiccheck — music playlists
        if: ${{ !cancelled() }}
        run: node tools/musiccheck.js
      - name: cleanupcheck — save cleanup classifier
        if: ${{ !cancelled() }}
        run: node tools/cleanupcheck.js
      - name: netcheck — host-side wire gates (admission, identity, chat)
        if: ${{ !cancelled() }}
        run: node tools/netcheck.js
      - name: sinkcheck — the GM's renderers against a campaign from a file
        if: ${{ !cancelled() }}
        run: node tools/sinkcheck.js
      - name: framecheck — the token creator's pure core
        if: ${{ !cancelled() }}
        run: node tools/framecheck.js
      - name: calendarcheck — the game calendar's pure core
        if: ${{ !cancelled() }}
        run: node tools/calendarcheck.js
      - name: videocheck — campaign videos' pure core and the Video panel's rules
        if: ${{ !cancelled() }}
        run: node tools/videocheck.js
      - name: zipcheck — the export bundle's archive, at any size
        if: ${{ !cancelled() }}
        run: node tools/zipcheck.js
      - name: textcheck — text formats (the look of a plain field, stored beside its text), the editor's boxes and the bar on them
        if: ${{ !cancelled() }}
        run: node tools/textcheck.js
      - name: pagecheck — the page's own navigation (the Outline of a planner or a page, and its menu)
        if: ${{ !cancelled() }}
        run: node tools/pagecheck.js
      - name: floatcheck — floating boxes and the views they show on (put away off the play map, back as left)
        if: ${{ !cancelled() }}
        run: node tools/floatcheck.js
      - name: shelfcheck — pages in a session (where a page opens, the Pages shelf, tabs in the panel, map pins) and the names in this file
        if: ${{ !cancelled() }}
        run: node tools/shelfcheck.js
      - name: updatercheck — signed updates, the way back, the core updating itself, the key tool and the core's record (run on scratch installs; nothing downloaded is ever started)
        if: ${{ !cancelled() }}
        run: node tools/updatercheck.js
